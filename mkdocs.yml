site_name: Homelab
site_description: Docker stacks for a self-hosted media management & streaming setup
site_url: https://cliaz.github.io/homelab/
repo_url: https://github.com/cliaz/homelab
repo_name: cliaz/homelab
edit_uri: edit/main/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - include-markdown:
      rewrite_relative_urls: false

hooks:
  - docs/hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

exclude_docs: |
  hooks.py

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Getting started: getting-started.md
  - Design notes: design-notes.md
  - Stacks:
      - Core services:
          - stacks/core-services/index.md
          - Install & config: stacks/core-services/install.md
      - Download:
          - stacks/download/index.md
          - Install & config: stacks/download/install.md
      - Media:
          - stacks/media/index.md
          - Install & config: stacks/media/install.md
      - eBook:
          - stacks/ebook/index.md
          - Install & config: stacks/ebook/install.md
  - Remote access & maintenance:
      - Tailscale:
          - stacks/tailscale/index.md
          - Install & config: stacks/tailscale/install.md
      - WireGuard:
          - stacks/wireguard/index.md
          - Install & config: stacks/wireguard/install.md
      - Watchtower:
          - stacks/watchtower/index.md
          - Install & config: stacks/watchtower/install.md
  - Guides:
      - Radarr configuration: guides/radarr-config.md
