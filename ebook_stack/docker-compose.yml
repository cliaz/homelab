services:
  # Audiobook and podcast server
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    hostname: audiobookshelf
    extra_hosts: *host-server
    restart: unless-stopped
    user: "${AUDIOBOOKSHELF_UID}:${MEDIA_GID}"
    networks:
      - ebooks_net
    ports:
      - 13378:80
    environment:
      TZ: ${TZ:-Australia/Melbourne}
    volumes:
      # Config and metadata directory
      - ${CONFIG_DIR:?Please configure CONFIG_DIR in .env file}/audiobookshelf/config:/config
      - ${CONFIG_DIR:?Please configure CONFIG_DIR in .env file}/audiobookshelf/metadata:/metadata
      
      # Audiobooks directory - mount your audiobooks and podcasts here
      - ${DATA_DIR:?Please configure DATA_DIR in .env file}/media/audiobooks:/audiobooks
      - ${DATA_DIR:?Please configure DATA_DIR in .env file}/media/podcasts:/podcasts

  # Ebook and audiobook management - automatic download and organization
  lazylibrarian:
    image: linuxserver/lazylibrarian:latest
    container_name: lazylibrarian
    hostname: lazylibrarian
    extra_hosts: *host-server
    restart: unless-stopped
    networks:
      - ebooks_net
      - download_net
    ports:
      # Host port 5299 is mapped to container port 5299
      - 5299:5299
    environment:
      # The container is run as the user with this PUID and PGID (user and group id).
      PUID: ${LAZYLIBRARIAN_UID:?Please configure LAZYLIBRARIAN_UID in .env file}
      PGID: ${MEDIA_GID:?Please configure MEDIA_GID in .env file}
      TZ: ${TZ:-Australia/Melbourne}
      UMASK: 002
    volumes:
      # Config directory
      - ${CONFIG_DIR:?Please configure CONFIG_DIR in .env file}/lazylibrarian:/config
      # Root directory, so that lazylibrarian can see downloads as well as stored media
      - ${DATA_DIR:?Please configure DATA_DIR in .env file}:/data

networks:
  ## Assumption / Precondition: the external networks exist, either defined in core_services_stack or created manually
  # manual creation command: docker network create --attachable --subnet=172.16.3.0/24 ebooks_net
  ebooks_net:
    external: true
  # manual creation command: docker network create --attachable --subnet=172.16.1.0/24 download_net
  download_net:
    external: true